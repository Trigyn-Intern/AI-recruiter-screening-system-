name: lighthouse

on:
  pull_request:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Prerequisite: Install Ollama"
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: "Prerequisite: Install Node.js 18"
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: "Prerequisite: Install Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: "Prerequisite: Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Prerequisite: Install backend dependencies"
        run: |
          cd backend
          npm install

      - name: "Prerequisite: Install frontend dependencies"
        run: |
          cd frontend
          npm install

      - name: "Prerequisite: Pull Ollama model"
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: "Boot stack"
        run: |
          uvicorn api:api --host 127.0.0.1 --port 8000 &
          (cd backend && npm run dev) &
          (cd frontend && npm run dev) &
          sleep 20

      - name: "Wait for health endpoints"
        run: |
          for url in \
            http://127.0.0.1:8000/health \
            http://127.0.0.1:4000/api/health \
            http://127.0.0.1:5173/
          do
            echo "Waiting for $url..."
            for i in $(seq 1 30); do
              if curl -fsS "$url" >/dev/null 2>&1; then
                echo "$url is up"
                break
              fi
              sleep 1
            done
          done

      - name: "Run Lighthouse CI"
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:5173/
            http://localhost:5173/login
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: .github/lighthouse/budget.json
          assert: true