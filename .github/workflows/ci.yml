name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Unit Tests
        run: |
          pytest tests -v --ignore=tests/ui

  security-scan:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r . -x tests -s B101

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependency Check
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
          unzip dependency-check-9.0.9-release.zip

      - name: Run Dependency Check
        run: |
          ./dependency-check/bin/dependency-check.sh \
            --project AI-Recruiter-System \
            --scan . \
            --format HTML \
            --failOnCVSS 7 || true

  scenario-matrix:
    name: Playwright Scenario Matrix
    runs-on: ubuntu-latest

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    env:
      OLLAMA_HOST: http://localhost:11434

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright pytest-playwright streamlit pyyaml

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Wait for Ollama
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:11434/api/tags; then
              echo "Ollama is up"
              exit 0
            fi
            sleep 2
          done
          echo "Ollama failed to start"
          exit 1

      - name: Pre-pull Scenario Models
        env:
          OLLAMA_HOST: http://localhost:11434
        run: |
          python - <<'PY'
          import yaml, subprocess, sys
          cfg = yaml.safe_load(open("tests/data/scenarios.yaml", encoding="utf-8"))
          models = sorted({s["model"] for s in cfg.get("scenarios", [])})
          for model in models:
              print(f"Pulling {model}...", flush=True)
              subprocess.run(["ollama", "pull", model], check=True)
          PY

      - name: Run Scenario Matrix
        env:
          OLLAMA_HOST: http://localhost:11434
          APP_BASE_URL: http://localhost:8501
        run: |
          python tests/ui/run_scenario_matrix.py \
            --port 8501 \
            --config tests/data/scenarios.yaml \
            --pytest-args "--junitxml=test-results/scenario-matrix.xml"

      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: tests/ui/screenshots
          if-no-files-found: ignore

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-matrix-results
          path: test-results
          if-no-files-found: ignore
