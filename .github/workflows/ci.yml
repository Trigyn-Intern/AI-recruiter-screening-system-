name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Restrict default GITHUB_TOKEN permissions (Least Privilege)
permissions:
  contents: read

jobs:
  # ----------------------------------------------------
  # 1. Backend Testing & Report Generation
  # ----------------------------------------------------
  backend-test:
    name: Backend Unit Tests & AI Reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest unit suite
        run: pytest tests/unit

      - name: Generate AI engineering reports
        run: python scripts/ai_platform.py report

      - name: Upload engineering reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-reports
          path: reports/ai-*
          if-no-files-found: warn

  # ----------------------------------------------------
  # 2. Frontend Builds (Ran in Parallel)
  # ----------------------------------------------------
  frontend-builds:
    name: Frontend Builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                 # CHANGED: don't cancel the other app if one fails
      matrix:
        app: [frontend, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"           # CHANGED: Vite 8 + @vitejs/plugin-react 6 need >=20.19 / >=22.12
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Build ${{ matrix.app }}
        working-directory: ${{ matrix.app }}
        run: |
          npm ci
          npm run build

  # ----------------------------------------------------
  # 3. Static Code Security Analysis (Bandit & Pip-Audit)
  # ----------------------------------------------------
  security-scan:
    name: Code & Dependency Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: Run Bandit (High Severity/Confidence)
        run: |
          bandit -r backend api.py -s B101 --severity-level high --confidence-level high

      - name: Run Dependency Vulnerability Audit
        run: |
          pip-audit -r requirements.txt

  # ----------------------------------------------------
  # 4. OWASP Dependency Check
  # ----------------------------------------------------
  dependency-check:
    name: OWASP Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "AI-Recruiter-System"
          path: "."
          format: "HTML"
          out: "reports"
          args: >-
            --failOnCVSS 7
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Upload Dependency-Check Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check-report.html