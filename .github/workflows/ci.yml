name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-build:
    name: Tests and Frontend Builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend-test/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest unit suite
        run: pytest tests/unit

      - name: Generate AI engineering reports
        run: python scripts/ai_platform.py report

      - name: Build recruiter frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build testing dashboard
        working-directory: frontend-test
        run: |
          npm ci
          npm run build

      - name: Upload engineering reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engineering-reports
          path: reports/ai-*
          if-no-files-found: warn

  security-scan:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit
        run: |
          bandit -r backend api.py -s B101 --severity-level high --confidence-level high

      - name: Run Safety dependency scan
        run: safety check --file requirements.txt --full-report || true

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependency Check
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
          unzip dependency-check-9.0.9-release.zip

      - name: Cache OWASP Dependency-Check Data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-data-v1
          restore-keys: |
            dependency-check-data-v1-

      - name: Run Dependency Check
        run: |
          ./dependency-check/bin/dependency-check.sh \
            --project AI-Recruiter-System \
            --scan . \
            --format HTML \
            --failOnCVSS 7 || true





