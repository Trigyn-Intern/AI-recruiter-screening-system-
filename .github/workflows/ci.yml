name: CI Pipeline

on:
push:
branches: [main]
pull_request:

jobs:

unit-tests:
name: Unit Tests
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pytest

  - name: Run Unit Tests
    run: |
      pytest tests -v --ignore=tests/ui
```

security-scan:
name: Bandit Security Scan
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - name: Install Bandit
    run: |
      pip install bandit

  - name: Run Bandit
    run: |
      bandit -r . -x tests -s B101
```

dependency-check:
name: Dependency Vulnerability Scan
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - name: Install Dependency Check
    run: |
      sudo apt-get update
      sudo apt-get install -y wget unzip

      wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip

      unzip dependency-check-9.0.9-release.zip

  - name: Run Dependency Check
    run: |
      ./dependency-check/bin/dependency-check.sh \
        --project AI-Recruiter-System \
        --scan . \
        --format HTML \
        --failOnCVSS 11 || true
```

playwright-tests:
name: Playwright UI Tests
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-python@v5
    with:
      python-version: "3.10"

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
      pip install pytest playwright

  - name: Install Playwright Browsers
    run: |
      python -m playwright install --with-deps chromium

  - name: Start Streamlit
    run: |
      nohup streamlit run app.py \
        --server.port 8501 \
        --server.address 0.0.0.0 > app.log 2>&1 &

  - name: Wait for Streamlit
    run: |
      for i in {1..30}; do
        if curl -s http://localhost:8501 > /dev/null; then
          echo "Streamlit started"
          exit 0
        fi
        sleep 2
      done

      echo "Streamlit failed to start"
      cat app.log
      exit 1

  - name: Run Playwright Tests
    run: |
      pytest tests/ui -v
```
