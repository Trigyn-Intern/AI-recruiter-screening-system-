name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Unit Tests
        run: |
          pytest tests -v --ignore=tests/ui


  security-scan:
    name: Bandit Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Bandit
        run: |
          bandit -r backend api.py -s B101 --severity-level high --confidence-level high

  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependency Check
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

          wget https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
          unzip dependency-check-9.0.9-release.zip

      - name: Cache OWASP Dependency-Check Data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-data-v1
          restore-keys: |
            dependency-check-data-v1-

      - name: Run Dependency Check
        run: |
          ./dependency-check/bin/dependency-check.sh \
            --project AI-Recruiter-System \
            --scan . \
            --format HTML \
            --failOnCVSS 7 || true

  playwright-smoke:
    name: Playwright Smoke (single scenario)
    runs-on: ubuntu-latest

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright playwright pytest-asyncio pyyaml

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Install Ollama CLI
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Pull Ollama Model
        env:
          OLLAMA_HOST: http://localhost:11434
        run: |
          for i in {1..30}; do
            curl --fail http://localhost:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          ollama pull llama3.2

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Run Smoke Scenario
        env:
          OLLAMA_HOST: http://localhost:11434
        run: |
          python tests/ui/run_scenario_matrix.py \
            --filter python_ml_llama32 \
            --pytest-args="--junitxml=test-results/playwright-smoke.xml"

      - name: Upload Smoke Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke
          path: |
            test-results/playwright-smoke.xml
            tests/ui/screenshots/*.png
            tests/ui/logs/*.log

  scenario-matrix:
    name: Playwright Scenario Matrix
    runs-on: ubuntu-latest

    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-playwright playwright pytest-asyncio pyyaml

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Backend (auth) Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Playwright Browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Install Ollama CLI
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Pull Ollama Model
        env:
          OLLAMA_HOST: http://localhost:11434
        run: |
          for i in {1..30}; do
            curl --fail http://localhost:11434/api/tags >/dev/null 2>&1 && break
            sleep 2
          done
          ollama pull llama3.2

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Configure Auth Backend
        working-directory: backend
        run: |
          cp -n .env.example .env 2>/dev/null || true
          printf "MONGO_URI=mongodb://localhost:27017/ai_recruiter\nJWT_SECRET=$(node -e \"console.log(require('crypto').randomBytes(32).toString('hex'))\")\nJWT_EXPIRES_IN=7d\nCLIENT_ORIGIN=http://localhost:5173\nPORT=4000\n" > .env

      - name: Run Full Scenario Matrix
        env:
          OLLAMA_HOST: http://localhost:11434
          MONGO_URI: mongodb://localhost:27017/ai_recruiter
        run: |
          python tests/ui/run_scenario_matrix.py \
            --pytest-args="--junitxml=test-results/scenario-matrix.xml"

      - name: Upload Scenario Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-matrix
          path: |
            test-results/scenario-matrix.xml
            tests/ui/screenshots/*.png
            tests/ui/logs/*.log







