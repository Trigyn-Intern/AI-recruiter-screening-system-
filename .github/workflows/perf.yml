name: perf
on: [pull_request]

jobs:
  bench:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prerequisite: install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Prerequisite: install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prerequisite: install Python deps (includes pytest-benchmark)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-benchmark

      - name: Prerequisite: start Ollama and pull model
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2

      - name: Prerequisite: start FastAPI analyzer
        run: |
          uvicorn api:api --host 127.0.0.1 --port 8000 &
          sleep 10
          curl -fsS http://127.0.0.1:8000/health

      - name: Run pytest-benchmark
        # Note: --benchmark-compare-fail requires a stored baseline.
        # On the first run there is no baseline; the threshold check
        # is silently skipped. Subsequent runs use .benchmarks/baseline.json.
        run: |
          mkdir -p .benchmarks
          if [ -f .benchmarks/baseline.json ]; then
            echo "[perf] comparing against stored baseline"
            pytest tests/performance/benchmarks \
              --benchmark-storage=file://.benchmarks \
              --benchmark-json=bench.json \
              --benchmark-compare-fail=mean:25% \
              --benchmark-compare-fail=stddev:25%
          else
            echo "[perf] no baseline yet; storing this run as the baseline"
            pytest tests/performance/benchmarks \
              --benchmark-storage=file://.benchmarks \
              --benchmark-json=bench.json \
              --benchmark-save=baseline
          fi

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.json

      - name: Persist baseline
        # Keep the latest baseline so the next PR can compare against it.
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: .benchmarks/baseline.json
