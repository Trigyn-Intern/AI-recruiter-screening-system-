name: Run Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-mock coverage

    - name: Run Tests
      run: |
        pytest -v

    - name: Coverage
      run: |
        coverage run -m pytest
        coverage report