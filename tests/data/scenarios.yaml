# ============================================================
#  Playwright Scenario Matrix
# ============================================================
#  Each entry below is one end-to-end Playwright scenario.
#  The automation script reads this file and runs the SAME
#  parameterized test once per scenario (parametrized loop).
#
#  Fields:
#    id            - short identifier used in test name + screenshot
#    model         - Ollama model to use (must be installed locally)
#    jd_file       - path to a plain-text Job Description file
#    resume_files  - list of resume files (PDF/DOCX) to upload
#    expected_min_score    - optional soft check on best match score
#    expected_resume       - optional resume name that should rank #1
#    expected_resumes_any  - optional list; passes if top name is in it
#    notes                 - free-form description for the test report
# ============================================================

base_url: "http://localhost:8501"

scenarios:

  - id: "python_ml_llama32"
    model: "llama3.2"
    jd_file: "tests/data/jds/jd_python_ml.txt"
    resume_files:
      - "tests/data/resumes/resume_strong_python.pdf"
      - "tests/data/resumes/resume_data_engineer.pdf"
      - "tests/data/resumes/resume_frontend.pdf"
      - "tests/data/resumes/resume_junior.pdf"
    expected_min_score: 50
    # Either of the two Python-heavy resumes may legitimately rank #1 for a
    # broad "Python + ML" JD; the embedding model also weighs the deployment
    # / FastAPI tokens that both share.
    expected_resumes_any:
      - "resume_strong_python.pdf"
      - "resume_data_engineer.pdf"
    notes: "Python/ML resumes (strong + data) should both beat frontend/junior."

  - id: "data_engineer_llama32"
    model: "llama3.2"
    jd_file: "tests/data/jds/jd_data_engineer.txt"
    resume_files:
      - "tests/data/resumes/resume_data_engineer.pdf"
      - "tests/data/resumes/resume_strong_python.pdf"
      - "tests/data/resumes/resume_frontend.pdf"
    expected_min_score: 40
    expected_resume: "resume_data_engineer.pdf"
    notes: "Data engineer resume should clearly outrank others for a DE JD."

  - id: "frontend_react_llama32"
    model: "llama3.2"
    jd_file: "tests/data/jds/jd_frontend_react.txt"
    resume_files:
      - "tests/data/resumes/resume_frontend.pdf"
      - "tests/data/resumes/resume_strong_python.pdf"
      - "tests/data/resumes/resume_data_engineer.pdf"
    expected_min_score: 30
    expected_resume: "resume_frontend.pdf"
    notes: "React/frontend resume should outrank backend/data resumes."